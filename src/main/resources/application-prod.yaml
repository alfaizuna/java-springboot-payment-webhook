spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:baseapp_db}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      idle-timeout: 30000
      pool-name: BaseappHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        '[format_sql]': false

  flyway:
    enabled: true
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

server:
  port: ${PORT:8080}
  forward-headers-strategy: native

application:
  security:
    jwt:
      rsa:
        private-key-location: ${RSA_PRIVATE_KEY_LOCATION:classpath:certs/private_key.pem}
        public-key-location: ${RSA_PUBLIC_KEY_LOCATION:classpath:certs/public_key.pem}
      expiration: ${JWT_EXPIRATION:86400000} # 24 jam (milidetik)
      refresh-token:
        expiration: ${REFRESH_TOKEN_EXPIRATION:604800000} # 7 hari (milidetik)
