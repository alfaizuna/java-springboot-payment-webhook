services:
  postgres:
    image: postgres:16-alpine
    container_name: baseapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-baseapp_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-baseapp_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - baseapp-network

  redis:
    image: redis:7-alpine
    container_name: baseapp-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - baseapp-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: baseapp-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-baseapp_db}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      REFRESH_TOKEN_EXPIRATION: ${REFRESH_TOKEN_EXPIRATION:-604800000}
      RSA_PRIVATE_KEY_LOCATION: ${RSA_PRIVATE_KEY_LOCATION:-classpath:certs/private_key.pem}
      RSA_PUBLIC_KEY_LOCATION: ${RSA_PUBLIC_KEY_LOCATION:-classpath:certs/public_key.pem}
    networks:
      - baseapp-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  baseapp-network:
    driver: bridge
